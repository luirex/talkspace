<style>
/* ============ TEMAS ============ */
:root{--ease:cubic-bezier(.2,.7,.2,1);--r:14px}
[data-theme=dark]{color-scheme:dark;--bg:#0c0c0f;--bg2:#121217;--card:#17171e;--card2:#1e1e27;--line:rgba(255,255,255,.08);--text:#ece8df;--muted:#9b978d;--gold:#d6b26e;--gold-i:#1a1407;--danger:#e5636b;--ok:#6fcf97;--sh:0 12px 34px rgba(0,0,0,.5);--glow:radial-gradient(900px 520px at 85% -10%,rgba(214,178,110,.13),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(214,178,110,.06),transparent 60%)}
[data-theme=light]{color-scheme:light;--bg:#f6f3ec;--bg2:#fbfaf6;--card:#ffffff;--card2:#f1ede4;--line:rgba(30,25,15,.1);--text:#1d1b17;--muted:#6d685d;--gold:#9a6f1f;--gold-i:#ffffff;--danger:#c4414a;--ok:#2e8b57;--sh:0 12px 34px rgba(60,45,10,.12);--glow:radial-gradient(900px 520px at 85% -10%,rgba(176,130,40,.14),transparent 60%)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font:15px/1.55 Inter,system-ui,sans-serif;background-color:var(--bg);background-image:var(--glow);background-attachment:fixed;color:var(--text);min-height:100vh;transition:background-color .3s,color .3s}
.serif{font-family:'Playfair Display',Georgia,serif;font-weight:600;letter-spacing:.2px}
.muted{color:var(--muted)}.sm{font-size:13px}.grow{flex:1}.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn svg,.icon svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:12px}

/* ============ BOTONES ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:500;border:1px solid var(--line);background:var(--card);transition:transform .15s var(--ease),box-shadow .2s,background .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}.btn:active{transform:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 65%,#000));color:var(--gold-i);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;color:var(--muted);transition:.2s}
.icon:hover{background:var(--card2);color:var(--text)}
.star.on{color:var(--gold)}.star.on svg{fill:currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted);transition:.2s}
.chip.on{color:var(--gold);border-color:var(--gold)}.chip.on svg{fill:currentColor}

/* ============ FORMULARIOS ============ */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:14px}
label input,label select{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);transition:border .2s,box-shadow .2s}
label input:focus,label select:focus,.search input:focus,select.f:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.pw{position:relative}.pw input{padding-right:46px}.pw .eye{position:absolute;right:6px;top:12px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:10px}
small.hint{display:block;margin:-8px 0 14px;font-size:12px;color:var(--muted)}

/* ============ AUTH ============ */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:410px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:38px 32px;box-shadow:var(--sh);animation:rise .6s var(--ease)}
.auth-card h1{font-size:30px;margin:14px 0 4px}.auth-card p{margin-bottom:26px}
.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font:400 40px/1 'Great Vibes','Playfair Display',cursive;padding-top:5px;color:var(--gold-i);background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 55%,#000));box-shadow:0 8px 22px color-mix(in srgb,var(--gold) 30%,transparent)}
.logo.sm{width:34px;height:34px;border-radius:10px;font-size:27px;padding-top:3px}
.notice{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ CABECERA ============ */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header.top .row{height:64px}
.brand{display:flex;align-items:center;gap:10px;font:600 19px 'Playfair Display',serif}
nav{display:flex;gap:4px;margin-left:18px}
nav button{padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:500;transition:.2s}
nav button:hover{color:var(--text)}nav button.on{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.user{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 55%,#000));color:var(--gold-i)}

/* ============ PÁGINAS ============ */
.page{padding:36px 0 80px;animation:rise .45s var(--ease)}.page.narrow{max-width:800px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head h2{font-size:34px;line-height:1.15}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.search:focus-within{border-color:var(--gold)}.search input{flex:1;border:0;background:none;padding:11px 0;color:var(--text);outline:0}
select.f{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;animation:rise .4s var(--ease) backwards}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:20px;line-height:1.25}
.excerpt{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:63px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;padding:3px 10px;border-radius:999px;color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.card-act{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:12px}.card-act .grow{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}
.empty h3{color:var(--text);font-size:24px;margin-bottom:8px}.empty .btn{margin-top:18px}

/* ============ EDITOR ============ */
.ed-top{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.ed-title{width:100%;border:0;background:none;outline:0;color:var(--text);font-size:clamp(28px,5vw,42px);line-height:1.2;margin-bottom:8px}
.ed-tags{width:100%;border:0;background:none;outline:0;color:var(--gold);font-size:14px;margin-bottom:18px}
.ed-title::placeholder,.ed-tags::placeholder{color:var(--muted);opacity:.6}
.fmt{display:flex;gap:4px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--card);position:sticky;top:74px;z-index:5;width:max-content;max-width:100%;margin-bottom:18px;overflow-x:auto}
.fmt button{min-width:36px;height:36px;border-radius:9px;color:var(--muted);font-weight:600}.fmt button:hover{background:var(--card2);color:var(--text)}
.ed{min-height:55vh;outline:0;font:19px/1.85 Lora,Georgia,serif;padding-bottom:40px}
.ed:empty:before{content:attr(data-ph);color:var(--muted);opacity:.6}
.ed h2,.r-content h2{font:600 26px 'Playfair Display',serif;margin:1.1em 0 .4em;color:var(--gold)}
.ed blockquote,.r-content blockquote{border-left:3px solid var(--gold);padding-left:18px;margin:1em 0;font-style:italic;color:var(--muted)}
.ed ul,.r-content ul{padding-left:1.4em}.ed p,.r-content p{margin-bottom:.9em}
.ed-foot{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 40%);font-size:13px;color:var(--muted)}

/* ============ ADMIN ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--line)}

/* ---- Importar Word / PDF / TXT (librerías cargadas solo cuando se necesitan) ---- */
const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
const MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_W = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const textToHtml = t => t.split(/\n{2,}/).map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
async function docxToHtml(buf) {
  if (!window.mammoth) await loadScript(MAMMOTH);
  const r = await window.mammoth.convertToHtml({ arrayBuffer: buf }, { convertImage: window.mammoth.images.imgElement(() => Promise.resolve({ src: '' })) });
  const d = new DOMParser().parseFromString('<body>' + r.value, 'text/html');
  d.querySelectorAll('img').forEach(n => n.remove());
  d.querySelectorAll('h1,h3,h4,h5,h6').forEach(h => { const n = document.createElement('h2'); n.innerHTML = h.innerHTML; h.replaceWith(n); });
  d.querySelectorAll('ol,table').forEach(n => { if (n.tagName === 'TABLE') n.replaceWith(...[...n.querySelectorAll('tr')].map(tr => { const p = document.createElement('p'); p.textContent = [...tr.children].map(c => c.textContent.trim()).join(' · '); return p; })); });
  d.querySelectorAll('a').forEach(a => a.replaceWith(...a.childNodes));
  d.querySelectorAll('p').forEach(p => { if (!p.textContent.trim() && !p.querySelector('br')) p.remove(); });
  return d.body.innerHTML;
}
async function pdfToHtml(buf) {
  if (!window.pdfjsLib) { await loadScript(PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_W; }
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise, paras = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str !== undefined);
    let cur = '', py = null, ph = 0;
    for (const it of items) {
      const y = it.transform[5], h = Math.abs(it.transform[3]) || 10;
      if (py !== null && Math.abs(py - y) > h * .5 && it.str.trim()) {
        if (py - y > Math.max(ph, h) * 1.7 || y > py) { if (cur.trim()) paras.push(cur.trim()); cur = ''; }
        else cur = cur.endsWith('-') ? cur.slice(0, -1) : cur.replace(/\s*$/, ' ');
      }
      cur += it.str; if (it.str.trim()) { py = y; ph = h; }
    }
    if (cur.trim()) paras.push(cur.trim());
  }
  return paras.filter(p => !/^\d{1,3}$/.test(p)).map(p => `<p>${esc(p.replace(/\s{2,}/g, ' '))}</p>`).join('');
}
async function importDocs(files) {
  let ok = 0;
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase(), title = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 200);
    try {
      if (f.size > 15 * 1024 * 1024) throw new Error('El archivo supera 15 MB.');
      toast(`Importando ${f.name}…`);
      let html;
      if (ext === 'docx') html = await docxToHtml(await f.arrayBuffer());
      else if (ext === 'pdf') html = await pdfToHtml(await f.arrayBuffer());
      else if (ext === 'txt') html = textToHtml((await f.text()).replace(/\r\n?/g, '\n'));
      else if (ext === 'doc') throw new Error('Formato .doc antiguo: guárdalo como .docx desde Word.');
      else throw new Error('Formato no compatible.');
      html = sanitize(html);
      if (!htmlToText(html)) throw new Error('No se encontró texto (¿PDF escaneado como imagen?).');
      if (new Blob([html]).size > 900000) throw new Error('El texto es demasiado largo para un solo discurso.');
      createSpeech({ titulo: title, contenido: html, etiquetas: ['importado'] }, false); ok++;
    } catch (er) { console.error(er); toast(`${f.name}: ${er.message || 'no se pudo importar.'}`, 'err'); }
  }
  if (ok) toast(`${ok} discurso${ok > 1 ? 's' : ''} importado${ok > 1 ? 's' : ''}`);
}

  const m = modal(`<h3>Importar y respaldo</h3><p class="muted">Importa discursos desde Word (.docx), PDF o texto, o gestiona un respaldo completo. Lo importado se añade, no reemplaza.</p><div class="actions col"><button class="btn" data-e>${ic.download} Exportar respaldo (.json)</button><label class="btn gold" style="margin:0;cursor:pointer">${ic.plus} Importar Word, PDF o TXT<input type="file" data-doc multiple accept=".docx,.pdf,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" style="display:none"></label><label class="btn" style="margin:0;cursor:pointer;color:var(--text)">Importar respaldo (.json)<input type="file" data-json accept=".json,application/json" style="display:none"></label></div>`);

/* ---- Exportar a Word ---- */
const DOCX_URL = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
/* DOCX START */
function buildDocx(d, lib) {
  const { Document, TextRun, Paragraph, HeadingLevel } = lib, kids = [];
  const body = new DOMParser().parseFromString('<body>' + sanitize(d.contenido), 'text/html').body;
  const runs = (node, st = {}) => {
    const out = [];
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) { const t = n.textContent.replace(/​/g, '').replace(/[\r\n]+/g, ' '); if (t) out.push(new TextRun({ text: t, ...st })); }
      else if (n.nodeType === 1) {
        const t = n.tagName;
        if (t === 'BR') out.push(new TextRun({ break: 1 }));
        else if (t === 'SUP' && n.classList.contains('fn')) out.push(new TextRun({ text: n.textContent, superScript: true, ...st }));
        else {
          const s = { ...st }; if (t === 'B' || t === 'STRONG') s.bold = true; if (t === 'I' || t === 'EM') s.italics = true; if (t === 'U') s.underline = {};
          const bg = n.style && n.style.backgroundColor; if (bg && !/transparent|rgba\(0,\s*0,\s*0,\s*0\)/.test(bg)) s.highlight = 'yellow';
          out.push(...runs(n, s));
        }
      }
    });
    return out;
  };
  const block = n => {
    if (n.nodeType === 3) { const t = n.textContent.trim(); if (t) kids.push(new Paragraph({ spacing: { after: 160 }, children: [new TextRun(t)] })); return; }
    if (n.nodeType !== 1) return; const t = n.tagName;
    if (t === 'H2') kids.push(new Paragraph({ heading: HeadingLevel.HEADING_1, spacing: { before: 280, after: 120 }, children: runs(n) }));
    else if (t === 'BLOCKQUOTE') { if (n.textContent.trim()) kids.push(new Paragraph({ indent: { left: 720 }, spacing: { after: 160 }, children: runs(n, { italics: true }) })); }
    else if (t === 'UL' || t === 'OL') [...n.children].filter(li => li.tagName === 'LI').forEach((li, i) => kids.push(new Paragraph(t === 'UL' ? { bullet: { level: 0 }, spacing: { after: 80 }, children: runs(li) } : { indent: { left: 720, hanging: 360 }, spacing: { after: 80 }, children: [new TextRun(`${i + 1}. `), ...runs(li)] })));
    else if (t === 'DIV' && [...n.children].some(c => /^(P|DIV|H2|UL|OL|BLOCKQUOTE)$/.test(c.tagName))) n.childNodes.forEach(block);
    else if (n.textContent.trim()) kids.push(new Paragraph({ spacing: { after: 160 }, children: runs(n) }));
  };
  kids.push(new Paragraph({ heading: HeadingLevel.TITLE, spacing: { after: 300 }, children: [new TextRun(d.titulo || 'Discurso')] }));
  body.childNodes.forEach(block);
  const refs = d.referencias || [];
  if (refs.some(r => r && r.trim())) {
    kids.push(new Paragraph({ heading: HeadingLevel.HEADING_2, spacing: { before: 360, after: 120 }, children: [new TextRun('Referencias')] }));
    refs.forEach((r, i) => { if (r && r.trim()) kids.push(new Paragraph({ indent: { left: 360, hanging: 360 }, spacing: { after: 80 }, children: [new TextRun({ text: `${i + 1}. ${r.trim()}`, size: 20 })] })); });
  }
  return new Document({ creator: 'Elevate', title: d.titulo || 'Discurso', styles: { default: { document: { run: { font: 'Georgia', size: 24 }, paragraph: { spacing: { line: 340 } } } } }, sections: [{ children: kids }] });
}
/* DOCX END */
async function exportDocx(d, name) {
  if (!window.docx) await loadScript(DOCX_URL);
  const blob = await window.docx.Packer.toBlob(buildDocx(d, window.docx));
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.docx'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  };
  const delRef = i => {
    $$('sup.fn', ed).forEach(s => { const n = +s.textContent; if (n === i + 1) s.remove(); else if (n > i + 1) s.textContent = n - 1; });
    S.cur.refs.splice(i, 1); paintRefs(); count(); scheduleSave();
  };
  paintRefs();
  S.cur.insertQuote = q => {
    ed.focus(); const sl = getSelection(), r = S.cur.range || (() => { const x = document.createRange(); x.selectNodeContents(ed); x.collapse(false); return x; })();
    sl.removeAllRanges(); sl.addRange(r); let n = 0;
    if (q.fuente && q.fuente.trim()) { S.cur.refs.push(q.fuente.trim()); n = S.cur.refs.length; }
    document.execCommand('insertHTML', false, `<blockquote>${esc(q.texto)}${n ? `<sup class="fn" contenteditable="false">${n}</sup>` : ''}</blockquote><p><br></p>`);
    paintRefs(); count(); scheduleSave();
  };
  const cmds = { bold: ['bold'], italic: ['italic'], h2: ['formatBlock', 'h2'], ul: ['insertUnorderedList'], quote: ['formatBlock', 'blockquote'], p: ['formatBlock', 'p'] };
  $$('.fmt button').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => {
    const k = b.dataset.c; if (k === 'fn') return addRef(true);
    if (k === 'qt') { const sl = getSelection(); S.cur.range = sl.rangeCount && ed.contains(sl.anchorNode) ? sl.getRangeAt(0).cloneRange() : null; return quotePicker(); }
    ed.focus();
    if (k === 'hl') { document.execCommand('styleWithCSS', false, true); const cur = document.queryCommandValue('hiliteColor'), on = cur && !/^(rgba\(0, 0, 0, 0\)|transparent)$/.test(cur); document.execCommand('hiliteColor', false, on ? 'transparent' : 'rgba(214,178,110,.45)'); document.execCommand('styleWithCSS', false, false); }
    else { const [c, v] = cmds[k]; document.execCommand(c, false, v ?? null); }
    scheduleSave();
  }; });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
  ed.addEventListener('input', () => { count(); scheduleSave(); });
  $('#ti').oninput = scheduleSave; $('#tgs').oninput = scheduleSave; $('#fe').oninput = scheduleSave; $('#du').oninput = () => { count(); scheduleSave(); }; count();
  $('#bk').onclick = () => go('library');
  $('#rd').onclick = async () => { await saveNow(); openReader(readEditor()); };
  $('#ex').onclick = exportModal; $('#hs').onclick = historyModal; $('#shr').onclick = shareModal;
  if (!sp.titulo && !sp.contenido) $('#ti').focus();
}
const readEditor = () => ({ id: S.cur.id, titulo: $('#ti').value.trim(), contenido: sanitize($('#ed').innerHTML), etiquetas: $('#tgs').value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 8), referencias: S.cur.refs.map(t => (t || '').trim()), fecha: $('#fe').value || '', duracion: +$('#du').value || 0 });
const setStatus = (t, c) => { const s = $('#st'); if (s) { s.textContent = t; s.style.color = c === 'err' ? 'var(--danger)' : ''; } };
function scheduleSave() { S.dirty = true; setStatus('Guardando…'); clearTimeout(S.t); S.t = setTimeout(saveNow, 800); }
async function saveNow() {
  if (!S.dirty || !S.cur || !$('#ed')) return; clearTimeout(S.t); S.dirty = false; const d = readEditor();
  try { await updateDoc(doc(col(), d.id), { titulo: d.titulo, contenido: d.contenido, etiquetas: d.etiquetas, referencias: d.referencias, fecha: d.fecha, duracion: d.duracion, actualizadoEn: serverTimestamp() }); syncShare(d); maybeSnapshot(d); if (!S.dirty) setStatus('Guardado'); }
  catch (e) { S.dirty = true; setStatus('Error al guardar', 'err'); }
}
function flushSave() { if (S.view === 'editor' && S.dirty) saveNow(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('beforeunload', flushSave);
function exportModal() {
  const d = readEditor(), text = htmlToText(d.contenido, true) + refsTxt(d.referencias), name = (d.titulo || 'discurso').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi, '-').replace(/^-|-$/g, '') || 'discurso';
  const m = modal(`<h3>Exportar</h3><div class="actions col"><button class="btn gold" data-w>${ic.download} Word (.docx)</button><button class="btn" data-t>${ic.download} Texto (.txt)</button><button class="btn" data-p>${ic.download} PDF / Imprimir</button><button class="btn" data-tp>${ic.tpl} Guardar como plantilla</button><button class="btn ghost danger" data-d style="color:var(--danger)">${ic.trash} Eliminar discurso</button></div>`);
  m.querySelector('[data-t]').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([`${d.titulo}\n\n${text}\n`], { type: 'text/plain;charset=utf-8' })); a.download = name + '.txt'; a.click(); URL.revokeObjectURL(a.href); m.close(); };
  m.querySelector('[data-p]').onclick = () => { m.close(); $('#print').innerHTML = `<h1>${esc(d.titulo)}</h1>${d.contenido}${refsHtml(d.referencias, 'pr-refs')}`; document.body.classList.add('printing'); window.addEventListener('afterprint', () => document.body.classList.remove('printing'), { once: true }); setTimeout(() => window.print(), 150); };
  m.querySelector('[data-w]').onclick = async () => { m.close(); try { toast('Generando Word…'); await exportDocx(d, name); } catch (er) { console.error(er); toast('No se pudo generar el archivo Word.', 'err'); } };
  m.querySelector('[data-tp]').onclick = () => { m.close(); saveTemplateModal(d); };
  m.querySelector('[data-d]').onclick = async () => { m.close(); if (await confirmDlg('¿Eliminar discurso?', 'Se borrará de forma permanente, junto con su historial y su enlace compartido.')) { S.dirty = false; try { await removeSpeech(d.id); toast('Discurso eliminado'); go('library'); } catch (er) { toast(authMsg(er.code), 'err'); } } };
}

/* ====================== 8. MODO LECTURA / TELEPROMPTER ====================== */
function openReader(sp) {
  let cfg = { speed: 60, fs: 44, lh: 1.7, w: 70, mirror: false, guide: true, target: 0 };
  try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('elo_rd') || '{}') }; } catch (e) { }
  cfg.target = sp.duracion || 0;
  const ov = document.createElement('div'); ov.className = 'reader';
  ov.innerHTML = `<div class="r-prog"><i id="rp"></i></div>
  <div class="r-scroll" id="rs"><article class="r-content" id="rc"><h1>${esc(sp.titulo || '')}</h1>${sanitize(sp.contenido || '')}${refsHtml(sp.referencias, 'r-refs')}</article></div><div class="r-guide" id="rg"></div>
  <div class="r-ctrl"><div class="r-row"><button class="rb" id="rx" title="Salir (Esc)">${ic.x}</button><button class="rb" id="rr" title="Reiniciar">${ic.restart}</button>
  <button class="rb big" id="rpl" title="Reproducir / pausa (Espacio)">${ic.play}</button>
  <label class="rl">Velocidad<input type="range" id="rsp" min="10" max="220" step="5"></label>
  <span class="rt"><b id="rtm">00:00</b>/<input id="rtg" type="number" min="0" max="180" placeholder="0" aria-label="Minutos objetivo">min</span></div>
  <div class="r-row"><label class="rl">Texto<input type="range" id="rfs" min="24" max="110" step="2"></label><label class="rl">Interlínea<input type="range" id="rlh" min="1.2" max="2.4" step=".1"></label>
  <label class="rl">Ancho<input type="range" id="rw" min="40" max="100" step="5"></label><button class="rb" id="rm" title="Modo espejo">${ic.mirror}</button><button class="rb" id="rgd" title="Línea guía">${ic.line}</button></div></div>`;
  document.body.appendChild(ov); try { ov.requestFullscreen?.(); } catch (e) { }
  const rs = $('#rs', ov), rc = $('#rc', ov), rpl = $('#rpl', ov);
  let playing = false, raf, last = 0, pos = 0, lastSet = 0, elapsed = 0, idle;
  const save = () => { try { localStorage.setItem('elo_rd', JSON.stringify({ ...cfg, target: 0 })); } catch (e) { } };
  const apply = () => {
    rc.style.fontSize = cfg.fs + 'px'; rc.style.lineHeight = cfg.lh; rc.style.maxWidth = cfg.w + 'vw'; rc.style.transform = cfg.mirror ? 'scaleX(-1)' : '';
    $('#rg', ov).style.display = cfg.guide ? '' : 'none'; $('#rm', ov).classList.toggle('on', cfg.mirror); $('#rgd', ov).classList.toggle('on', cfg.guide);
    $('#rsp', ov).value = cfg.speed; $('#rfs', ov).value = cfg.fs; $('#rlh', ov).value = cfg.lh; $('#rw', ov).value = cfg.w; $('#rtg', ov).value = cfg.target || '';
  };
  const update = () => {
    const max = rs.scrollHeight - rs.clientHeight || 1; $('#rp', ov).style.width = Math.min(100, rs.scrollTop / max * 100) + '%';
    const t = $('#rtm', ov); t.textContent = fmtTime(elapsed); t.classList.toggle('over', cfg.target > 0 && elapsed > cfg.target * 60);
  };
  const tick = now => {
    if (!playing) return; const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (Math.abs(rs.scrollTop - lastSet) > 2) pos = rs.scrollTop;
    pos += cfg.speed * dt; const max = rs.scrollHeight - rs.clientHeight;
    if (pos >= max) { pos = max; setPlay(false); }
    rs.scrollTop = pos; lastSet = rs.scrollTop; elapsed += dt; update(); raf = requestAnimationFrame(tick);
  };
  function setPlay(v) {
    playing = v; rpl.innerHTML = v ? ic.pause : ic.play; cancelAnimationFrame(raf);
    if (v) { last = performance.now(); pos = lastSet = rs.scrollTop; raf = requestAnimationFrame(tick); } else ov.classList.remove('idle');
    wake();
  }
  const wake = () => { ov.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if (playing) ov.classList.add('idle'); }, 3000); };
  ['mousemove', 'touchstart', 'keydown'].forEach(e => ov.addEventListener(e, wake, { passive: true }));
  rs.addEventListener('scroll', update, { passive: true });
  rs.onclick = () => setPlay(!playing); rpl.onclick = () => setPlay(!playing);
  $('#rr', ov).onclick = () => { setPlay(false); rs.scrollTop = 0; pos = lastSet = 0; elapsed = 0; update(); };
  const bindR = (id, k) => $('#' + id, ov).oninput = e => { cfg[k] = +e.target.value; apply(); save(); };
  bindR('rsp', 'speed'); bindR('rfs', 'fs'); bindR('rlh', 'lh'); bindR('rw', 'w'); bindR('rtg', 'target');
  $('#rm', ov).onclick = () => { cfg.mirror = !cfg.mirror; apply(); save(); };
  $('#rgd', ov).onclick = () => { cfg.guide = !cfg.guide; apply(); save(); };
  const close = () => { setPlay(false); clearTimeout(idle);
    if (sp.id && elapsed >= 30) { updateDoc(doc(col(), sp.id), { ensayos: increment(1), ultimoEnsayo: serverTimestamp(), ultimaDuracion: Math.round(elapsed) }).catch(() => { }); toast('Ensayo registrado · ' + fmtTime(elapsed)); } document.removeEventListener('keydown', keys, true); ov.remove(); if (document.fullscreenElement) document.exitFullscreen?.().catch(() => { }); };
  $('#rx', ov).onclick = close;
  function keys(e) {
    if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
    const k = e.key;
    if (k === 'Escape') close();
    else if (k === ' ') { e.preventDefault(); setPlay(!playing); }
    else if (k === 'ArrowUp') { e.preventDefault(); cfg.speed = Math.min(220, cfg.speed + 5); apply(); save(); }
    else if (k === 'ArrowDown') { e.preventDefault(); cfg.speed = Math.max(10, cfg.speed - 5); apply(); save(); }
    else if (k === '+' || k === '=') { cfg.fs = Math.min(110, cfg.fs + 2); apply(); save(); }
    else if (k === '-') { cfg.fs = Math.max(24, cfg.fs - 2); apply(); save(); }
  }
  document.addEventListener('keydown', keys, true);
  document.addEventListener('fullscreenchange', function f() { if (!document.fullscreenElement) { document.removeEventListener('fullscreenchange', f); } });
  apply(); update(); wake();
}

/* ====================== 9. PANEL DE ADMINISTRADOR ====================== */
function renderAdmin() {
  if (S.profile.rol !== 'admin') return go('library');
  $('#main').innerHTML = `<section class="page"><div class="head"><div><h2 class="serif">Administración</h2><p class="muted">Gestiona quién puede usar la aplicación.</p></div>
  <button class="btn gold" id="nu">${ic.plus} Nuevo usuario</button></div><div class="stats" id="stats"></div>
  <div class="toolbar"><div class="search">${ic.search}<input id="uq" placeholder="Buscar usuario…"></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Discursos</th><th>Creado</th><th></th></tr></thead><tbody id="ub"></tbody></table></div></section>`;
  $('#nu').onclick = () => userForm();
  $('#uq').oninput = paintUsers;
  $('#ub').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const u = S.users.find(x => x.id === b.closest('tr').dataset.id), a = b.dataset.a;
    if (a === 'edit') return userForm(u);
    if (a === 'toggle') { await updateDoc(doc(db, 'users', u.id), { activo: !u.activo }); return toast(u.activo ? 'Usuario desactivado' : 'Usuario activado'); }
    if (a === 'reset') {
      if (u.email.endsWith(DOMAIN)) return toast('Este usuario no tiene correo real. Debe cambiar su contraseña desde su cuenta, o crea uno nuevo.', 'err');
      try { await sendPasswordResetEmail(auth, u.email); toast('Correo de recuperación enviado'); } catch (er) { toast(authMsg(er.code), 'err'); } return;
    }
    if (a === 'del' && await confirmDlg('¿Eliminar usuario?', `Se borrarán "${u.nombre}" y todos sus discursos. Esta acción no se puede deshacer.`)) {
      try {
        const refs = [], sps = await getDocs(collection(db, 'users', u.id, 'speeches'));
        for (const d of sps.docs) { (await getDocs(collection(d.ref, 'versions'))).forEach(v => refs.push(v.ref)); if (d.data().compartido) refs.push(doc(db, 'shared', d.data().compartido)); refs.push(d.ref); }
        for (const c of ['quotes', 'templates']) (await getDocs(collection(db, 'users', u.id, c))).forEach(x => refs.push(x.ref));
        refs.push(doc(db, 'users', u.id));
        for (let i = 0; i < refs.length; i += 400) { const bt = writeBatch(db); refs.slice(i, i + 400).forEach(r => bt.delete(r)); await bt.commit(); }
        toast('Usuario eliminado');
      } catch (er) { toast(authMsg(er.code), 'err'); }
    }
  };
  S.unsubUsers?.();
  S.unsubUsers = onSnapshot(query(collection(db, 'users'), orderBy('creadoEn', 'desc')), snap => {
    S.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); paintUsers();
    S.users.forEach(u => { if (S.counts[u.id] === undefined) { S.counts[u.id] = 0; getCountFromServer(collection(db, 'users', u.id, 'speeches')).then(r => { S.counts[u.id] = r.data().count; paintUsers(); }).catch(() => { }); } });
  }, e => toast(authMsg(e.code), 'err'));
}
function paintUsers() {
  if (S.view !== 'admin') return;
  const q = ($('#uq')?.value || '').toLowerCase(), us = S.users;
  $('#stats').innerHTML = [['Usuarios', us.length], ['Activos', us.filter(u => u.activo).length], ['Administradores', us.filter(u => u.rol === 'admin').length], ['Discursos', Object.values(S.counts).reduce((a, b) => a + b, 0)]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#ub').innerHTML = us.filter(u => !q || (u.nombre + u.usuario).toLowerCase().includes(q)).map(u => {
    const me = u.id === S.user.uid;
    return `<tr data-id="${u.id}"><td><div class="who"><span class="av">${esc((u.nombre || '?')[0]).toUpperCase()}</span><div><b>${esc(u.nombre)}${me ? ' (tú)' : ''}</b><span class="muted sm">${esc(u.usuario)}</span></div></div></td>
    <td><span class="badge ${u.rol}">${u.rol === 'admin' ? 'Administrador' : 'Usuario'}</span></td><td><span class="badge ${u.activo ? 'on' : 'off'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
    <td>${S.counts[u.id] ?? '–'}</td><td class="muted sm">${fmtDate(u.creadoEn)}</td>
    <td><div class="acts"><button class="icon" data-a="edit" title="Editar">${ic.edit}</button><button class="icon" data-a="reset" title="Restablecer contraseña (correo)">${ic.mail}</button>
    ${me ? '' : `<button class="icon" data-a="toggle" title="${u.activo ? 'Desactivar' : 'Activar'}">${ic.power}</button><button class="icon" data-a="del" title="Eliminar">${ic.trash}</button>`}</div></td></tr>`;
  }).join('') || `<tr><td colspan="6" class="muted" style="text-align:center;padding:30px">Sin resultados</td></tr>`;
}
function userForm(u) {
  const m = modal(`<h3>${u ? 'Editar usuario' : 'Nuevo usuario'}</h3><form id="uf"><label>Nombre completo<input name="n" required value="${esc(u?.nombre)}"></label>
  <label>Usuario o correo de acceso<input name="u" required ${u ? 'disabled' : ''} value="${esc(u?.usuario)}" placeholder="ej. maria.lopez"></label>
  ${u ? '' : `<small class="hint">Sin espacios. Si escribes un correo real, podrá recuperar su contraseña por email.</small><label>Contraseña temporal<input name="p" type="text" minlength="6" required></label>`}
  <label>Rol<select name="r"><option value="user">Usuario</option><option value="admin" ${u?.rol === 'admin' ? 'selected' : ''}>Administrador</option></select></label>
  <div class="err" id="ue"></div><div class="actions"><button type="button" class="btn ghost" data-c>Cancelar</button><button class="btn gold">Guardar</button></div></form>`);
  m.querySelector('[data-c]').onclick = m.close;
  m.querySelector('#uf').onsubmit = async e => {
    e.preventDefault(); const f = e.target, b = f.querySelector('.gold'); b.disabled = true; const err = m.querySelector('#ue'); err.textContent = '';
    try {
      if (u) {
        if (u.id === S.user.uid && f.r.value !== 'admin') throw { code: 'self' };
        await updateDoc(doc(db, 'users', u.id), { nombre: f.n.value.trim(), rol: f.r.value }); toast('Usuario actualizado');
      } else {
        const usuario = f.u.value.trim().toLowerCase(), email = toEmail(usuario);
        if (email === DOMAIN) throw { code: 'auth/invalid-email' };
        const cred = await createUserWithEmailAndPassword(secAuth, email, f.p.value); await signOut(secAuth);
        await setDoc(doc(db, 'users', cred.user.uid), { nombre: f.n.value.trim(), usuario, email, rol: f.r.value, activo: true, creadoEn: serverTimestamp(), creadoPor: S.user.uid });
        toast('Usuario creado');
      }
      m.close();
    } catch (er) { err.textContent = er.code === 'self' ? 'No puedes quitarte el rol de administrador.' : authMsg(er.code); b.disabled = false; }
  };
}
