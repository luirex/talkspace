  'auth/invalid-credential': 'Usuario o contraseña incorrectos.', 'auth/user-not-found': 'Usuario o contraseña incorrectos.', 'auth/wrong-password': 'Usuario o contraseña incorrectos.',
  'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.', 'auth/email-already-in-use': 'Ese usuario o correo ya existe (aunque se haya eliminado antes, su acceso sigue registrado). Usa otro nombre.',
  'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.', 'auth/network-request-failed': 'Sin conexión a internet.', 'auth/invalid-email': 'Usuario o correo no válido.',
  'auth/requires-recent-login': 'Vuelve a iniciar sesión e inténtalo de nuevo.', 'permission-denied': 'No tienes permiso para esta acción.'
}[c] || 'Ocurrió un error. Intenta de nuevo.');
function toast(m, t = 'ok') { const e = document.createElement('div'); e.className = 'toast ' + t; e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => { e.classList.add('out'); setTimeout(() => e.remove(), 300); }, 3200); }
function modal(html) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(o);
  o.close = () => { o.classList.remove('in'); setTimeout(() => o.remove(), 200); };

}
const confirmDlg = (title, msg, ok = 'Eliminar', danger = true) => new Promise(res => {
  const m = modal(`<h3>${esc(title)}</h3><p class="muted">${esc(msg)}</p><div class="actions"><button class="btn ghost" data-n>Cancelar</button><button class="btn ${danger ? 'danger' : 'gold'}" data-y>${esc(ok)}</button></div>`);
  m.querySelector('[data-n]').onclick = () => { m.close(); res(false); };

const bindEyes = r => $$('[data-eye]', r).forEach(b => b.onclick = () => { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; });

/* ====================== 3. FIREBASE + ESTADO ====================== */
let auth, db, secAuth;

if (CONFIGURED) {

/* ====================== 4. AUTENTICACIÓN ====================== */
const authShell = inner => `<div class="auth"><div class="auth-card"><div class="logo">E</div>${inner}</div></div>`;

function showNotConfigured() {

}
async function showLogin() {

  bindEyes($('#root'));
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const b = $('#lb'); b.disabled = true; $('#le').textContent = '';

function showSetup() {
  $('#root').innerHTML = authShell(`<h1 class="serif">Bienvenido</h1><p class="muted" style="margin-bottom:16px">Configuración inicial: crea la cuenta del administrador.</p>

  <div class="err" id="se"></div><button class="btn gold block" id="sb">Crear administrador</button></form>`);
  bindEyes($('#root'));
  $('#sf').onsubmit = async e => {

    S.registering = true; let cred;

      bt.set(doc(db, 'users', cred.user.uid), { nombre, usuario, email, rol: 'admin', activo: true, creadoEn: serverTimestamp() });

async function handleUser(u) {
  try {
    const snap = await getDoc(doc(db, 'users', u.uid));
    if (!snap.exists()) { await signOut(auth); return toast('Tu cuenta no está registrada. Contacta al administrador.', 'err'); }
    const p = snap.data();
    if (!p.activo) { await signOut(auth); return toast('Tu cuenta está desactivada.', 'err'); }
    S.user = u; S.profile = { id: u.uid, ...p }; startApp();
  } catch (e) { console.error(e); try { await signOut(auth); } catch (x) { } toast(authMsg(e.code), 'err'); }
}
function stopListeners() { S.unsubSp?.(); S.unsubUsers?.(); S.unsubSp = S.unsubUsers = null; S.speeches = []; S.users = []; S.counts = {}; S.cur = null; S.dirty = false; }
if (!CONFIGURED) showNotConfigured();
else onAuthStateChanged(auth, async u => {
  if (S.registering) return;
  if (!u) { stopListeners(); S.user = S.profile = null; return showLogin(); }
  await handleUser(u);
});

/* ====================== 5. ESTRUCTURA DE LA APP ====================== */

function go(v, id) {

/* ====================== 6. BIBLIOTECA ====================== */
function renderLibrary() {
  $('#main').innerHTML = `<section class="page"><div class="head"><div><h2 class="serif">Tus discursos</h2><p class="muted" id="lsub"></p></div>
  <button class="btn gold" id="nw">${ic.plus} Nuevo discurso</button></div>

  <select class="f" id="tg"></select><button class="chip ${S.fav ? 'on' : ''}" id="fv">${ic.star} Favoritos</button></div><div class="grid" id="grid"></div></section>`;
  $('#nw').onclick = () => createSpeech();
  $('#q').oninput = e => { S.q = e.target.value; paintLibrary(); };
  $('#tg').onchange = e => { S.tag = e.target.value; paintLibrary(); };
  $('#fv').onclick = e => { S.fav = !S.fav; e.currentTarget.classList.toggle('on', S.fav); paintLibrary(); };

    if (a === 'fav') return updateDoc(doc(col(), id), { favorito: !sp.favorito });

    if (a === 'del') { if (await confirmDlg('¿Eliminar discurso?', `"${sp.titulo || 'Sin título'}" se borrará de forma permanente.`)) { await deleteDoc(doc(col(), id)); toast('Discurso eliminado'); } return; }
    go('editor', id);
  };

}
function paintLibrary() {
  if (S.view !== 'library') return;
  const tags = [...new Set(S.speeches.flatMap(s => s.etiquetas || []))].sort();
  if (S.tag && !tags.includes(S.tag)) S.tag = '';
  $('#tg').innerHTML = `<option value="">Todas las etiquetas</option>` + tags.map(t => `<option ${t === S.tag ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const q = S.q.trim().toLowerCase();
  const list = S.speeches.filter(s => (!S.fav || s.favorito) && (!S.tag || (s.etiquetas || []).includes(S.tag)) && (!q || (s.titulo || '').toLowerCase().includes(q) || s._t.toLowerCase().includes(q)));
  const total = S.speeches.reduce((a, s) => a + s._w, 0);
  $('#lsub').textContent = S.speeches.length ? `${S.speeches.length} discurso${S.speeches.length > 1 ? 's' : ''} · ${total.toLocaleString('es')} palabras` : 'Tu espacio para escribir y ensayar.';
  $('#grid').innerHTML = list.length ? list.map((s, i) => `<article class="card" data-id="${s.id}" style="animation-delay:${Math.min(i, 8) * 40}ms">
    <div class="card-top"><h3 class="serif">${esc(s.titulo || 'Sin título')}</h3><button class="icon star ${s.favorito ? 'on' : ''}" data-a="fav" aria-label="Favorito">${ic.star}</button></div>
    <p class="excerpt">${esc(s._t.slice(0, 170) || 'Discurso vacío…')}</p>
    <div class="tags">${(s.etiquetas || []).slice(0, 4).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="meta"><span>${s._w} palabras · ~${mins(s._w)} min</span><span>${fmtDate(s.actualizadoEn)}</span></div>
    <div class="card-act"><button class="btn sm gold" data-a="read">${ic.play} Leer</button><span class="grow"></span>
    <button class="icon" data-a="dup" title="Duplicar">${ic.copy}</button><button class="icon" data-a="del" title="Eliminar">${ic.trash}</button></div></article>`).join('')
    : `<div class="empty"><h3 class="serif">${S.speeches.length ? 'Sin resultados' : 'Tu primer discurso te espera'}</h3><p>${S.speeches.length ? 'Prueba con otra búsqueda o filtro.' : 'Escríbelo, ensáyalo y léelo con el modo teleprompter.'}</p>${S.speeches.length ? '' : `<button class="btn gold" onclick="document.getElementById('nw').click()">${ic.plus} Crear discurso</button>`}</div>`;
}
function createSpeech(data = {}, open = true) {
  const ref = doc(col());
  setDoc(ref, { titulo: '', contenido: '', etiquetas: [], favorito: false, creadoEn: serverTimestamp(), actualizadoEn: serverTimestamp(), ...data }).catch(e => toast(authMsg(e.code), 'err'));

/* ====================== 7. EDITOR ====================== */
function renderEditor(id) {
  const sp = S.speeches.find(x => x.id === id) || { id, titulo: '', contenido: '', etiquetas: [] };
  S.cur = { id }; S.dirty = false;
  $('#main').innerHTML = `<section class="page narrow"><div class="ed-top"><button class="btn ghost sm" id="bk">${ic.back} Biblioteca</button><span class="grow"></span>
  <span id="st" class="muted sm">Guardado</span><button class="btn sm" id="ex">${ic.download} Exportar</button><button class="btn gold sm" id="rd">${ic.play} Leer</button></div>
  <input id="ti" class="ed-title serif" placeholder="Título del discurso" value="${esc(sp.titulo)}" aria-label="Título">
  <input id="tgs" class="ed-tags" placeholder="Etiquetas separadas por comas (ej. conferencia, domingo)" value="${esc((sp.etiquetas || []).join(', '))}" aria-label="Etiquetas">
  <div class="fmt"><button data-c="bold" title="Negrita"><b>B</b></button><button data-c="italic" title="Cursiva"><i>I</i></button><button data-c="h2" title="Subtítulo">H</button><button data-c="ul" title="Lista">•</button><button data-c="quote" title="Cita">❝</button><button data-c="p" title="Párrafo normal">¶</button></div>
  <div id="ed" class="ed" contenteditable="true" data-ph="Comienza a escribir tu discurso…" spellcheck="true">${sanitize(sp.contenido)}</div>
  <div class="ed-foot"><span id="wc"></span></div></section>`;
  const ed = $('#ed'); document.execCommand('defaultParagraphSeparator', false, 'p');
  const count = () => { const w = words(ed.innerText); $('#wc').textContent = `${w} palabras · ~${mins(w)} min de lectura`; };
  const cmds = { bold: ['bold'], italic: ['italic'], h2: ['formatBlock', 'h2'], ul: ['insertUnorderedList'], quote: ['formatBlock', 'blockquote'], p: ['formatBlock', 'p'] };
  $$('.fmt button').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => { ed.focus(); const [c, v] = cmds[b.dataset.c]; document.execCommand(c, false, v ?? null); scheduleSave(); }; });
  ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
  ed.addEventListener('input', () => { count(); scheduleSave(); });
  $('#ti').oninput = scheduleSave; $('#tgs').oninput = scheduleSave; count();
  $('#bk').onclick = () => go('library');
  $('#rd').onclick = async () => { await saveNow(); openReader(readEditor()); };
  $('#ex').onclick = exportModal;
  if (!sp.titulo && !sp.contenido) $('#ti').focus();
}
const readEditor = () => ({ id: S.cur.id, titulo: $('#ti').value.trim(), contenido: sanitize($('#ed').innerHTML), etiquetas: $('#tgs').value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 8) });
const setStatus = (t, c) => { const s = $('#st'); if (s) { s.textContent = t; s.style.color = c === 'err' ? 'var(--danger)' : ''; } };
function scheduleSave() { S.dirty = true; setStatus('Guardando…'); clearTimeout(S.t); S.t = setTimeout(saveNow, 800); }
async function saveNow() {
  if (!S.dirty || !S.cur || !$('#ed')) return; clearTimeout(S.t); S.dirty = false; const d = readEditor();
  try { await updateDoc(doc(col(), d.id), { titulo: d.titulo, contenido: d.contenido, etiquetas: d.etiquetas, actualizadoEn: serverTimestamp() }); if (!S.dirty) setStatus('Guardado'); }
  catch (e) { S.dirty = true; setStatus('Error al guardar', 'err'); }
}
function flushSave() { if (S.view === 'editor' && S.dirty) saveNow(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('beforeunload', flushSave);
function exportModal() {
  const d = readEditor(), text = htmlToText(d.contenido), name = (d.titulo || 'discurso').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi, '-').replace(/^-|-$/g, '') || 'discurso';
  const m = modal(`<h3>Exportar</h3><div class="actions col"><button class="btn" data-t>${ic.download} Texto (.txt)</button><button class="btn" data-p>${ic.download} PDF / Imprimir</button><button class="btn ghost danger" data-d style="color:var(--danger)">${ic.trash} Eliminar discurso</button></div>`);
  m.querySelector('[data-t]').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([`${d.titulo}\n\n${text}\n`], { type: 'text/plain;charset=utf-8' })); a.download = name + '.txt'; a.click(); URL.revokeObjectURL(a.href); m.close(); };
  m.querySelector('[data-p]').onclick = () => { m.close(); $('#print').innerHTML = `<h1>${esc(d.titulo)}</h1>${d.contenido}`; document.body.classList.add('printing'); window.addEventListener('afterprint', () => document.body.classList.remove('printing'), { once: true }); setTimeout(() => window.print(), 150); };
  m.querySelector('[data-d]').onclick = async () => { m.close(); if (await confirmDlg('¿Eliminar discurso?', 'Se borrará de forma permanente.')) { S.dirty = false; await deleteDoc(doc(col(), d.id)); toast('Discurso eliminado'); go('library'); } };
}

/* ====================== 8. MODO LECTURA / TELEPROMPTER ====================== */
function openReader(sp) {
  let cfg = { speed: 60, fs: 44, lh: 1.7, w: 70, mirror: false, guide: true, target: 0 };
  try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('elo_rd') || '{}') }; } catch (e) { }
  const ov = document.createElement('div'); ov.className = 'reader';
  ov.innerHTML = `<div class="r-prog"><i id="rp"></i></div>
  <div class="r-scroll" id="rs"><article class="r-content" id="rc"><h1>${esc(sp.titulo || '')}</h1>${sanitize(sp.contenido || '')}</article></div><div class="r-guide" id="rg"></div>
  <div class="r-ctrl"><div class="r-row"><button class="rb" id="rx" title="Salir (Esc)">${ic.x}</button><button class="rb" id="rr" title="Reiniciar">${ic.restart}</button>
  <button class="rb big" id="rpl" title="Reproducir / pausa (Espacio)">${ic.play}</button>
  <label class="rl">Velocidad<input type="range" id="rsp" min="10" max="220" step="5"></label>
  <span class="rt"><b id="rtm">00:00</b>/<input id="rtg" type="number" min="0" max="180" placeholder="0" aria-label="Minutos objetivo">min</span></div>
  <div class="r-row"><label class="rl">Texto<input type="range" id="rfs" min="24" max="110" step="2"></label><label class="rl">Interlínea<input type="range" id="rlh" min="1.2" max="2.4" step=".1"></label>
  <label class="rl">Ancho<input type="range" id="rw" min="40" max="100" step="5"></label><button class="rb" id="rm" title="Modo espejo">${ic.mirror}</button><button class="rb" id="rgd" title="Línea guía">${ic.line}</button></div></div>`;
  document.body.appendChild(ov); try { ov.requestFullscreen?.(); } catch (e) { }
  const rs = $('#rs', ov), rc = $('#rc', ov), rpl = $('#rpl', ov);
  let playing = false, raf, last = 0, pos = 0, lastSet = 0, elapsed = 0, idle;
  const save = () => { try { localStorage.setItem('elo_rd', JSON.stringify(cfg)); } catch (e) { } };
  const apply = () => {
    rc.style.fontSize = cfg.fs + 'px'; rc.style.lineHeight = cfg.lh; rc.style.maxWidth = cfg.w + 'vw'; rc.style.transform = cfg.mirror ? 'scaleX(-1)' : '';
    $('#rg', ov).style.display = cfg.guide ? '' : 'none'; $('#rm', ov).classList.toggle('on', cfg.mirror); $('#rgd', ov).classList.toggle('on', cfg.guide);
    $('#rsp', ov).value = cfg.speed; $('#rfs', ov).value = cfg.fs; $('#rlh', ov).value = cfg.lh; $('#rw', ov).value = cfg.w; $('#rtg', ov).value = cfg.target || '';
  };
  const update = () => {
    const max = rs.scrollHeight - rs.clientHeight || 1; $('#rp', ov).style.width = Math.min(100, rs.scrollTop / max * 100) + '%';
    const t = $('#rtm', ov); t.textContent = fmtTime(elapsed); t.classList.toggle('over', cfg.target > 0 && elapsed > cfg.target * 60);
  };
  const tick = now => {
    if (!playing) return; const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (Math.abs(rs.scrollTop - lastSet) > 2) pos = rs.scrollTop;
    pos += cfg.speed * dt; const max = rs.scrollHeight - rs.clientHeight;
    if (pos >= max) { pos = max; setPlay(false); }
    rs.scrollTop = pos; lastSet = rs.scrollTop; elapsed += dt; update(); raf = requestAnimationFrame(tick);
  };
  function setPlay(v) {
    playing = v; rpl.innerHTML = v ? ic.pause : ic.play; cancelAnimationFrame(raf);
    if (v) { last = performance.now(); pos = lastSet = rs.scrollTop; raf = requestAnimationFrame(tick); } else ov.classList.remove('idle');
    wake();
  }
  const wake = () => { ov.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if (playing) ov.classList.add('idle'); }, 3000); };
  ['mousemove', 'touchstart', 'keydown'].forEach(e => ov.addEventListener(e, wake, { passive: true }));
  rs.addEventListener('scroll', update, { passive: true });
  rs.onclick = () => setPlay(!playing); rpl.onclick = () => setPlay(!playing);
  $('#rr', ov).onclick = () => { setPlay(false); rs.scrollTop = 0; pos = lastSet = 0; elapsed = 0; update(); };
  const bindR = (id, k) => $('#' + id, ov).oninput = e => { cfg[k] = +e.target.value; apply(); save(); };
  bindR('rsp', 'speed'); bindR('rfs', 'fs'); bindR('rlh', 'lh'); bindR('rw', 'w'); bindR('rtg', 'target');
  $('#rm', ov).onclick = () => { cfg.mirror = !cfg.mirror; apply(); save(); };
  $('#rgd', ov).onclick = () => { cfg.guide = !cfg.guide; apply(); save(); };
  const close = () => { setPlay(false); clearTimeout(idle); document.removeEventListener('keydown', keys, true); ov.remove(); if (document.fullscreenElement) document.exitFullscreen?.().catch(() => { }); };
  $('#rx', ov).onclick = close;
  function keys(e) {
    if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
    const k = e.key;
    if (k === 'Escape') close();
    else if (k === ' ') { e.preventDefault(); setPlay(!playing); }
    else if (k === 'ArrowUp') { e.preventDefault(); cfg.speed = Math.min(220, cfg.speed + 5); apply(); save(); }
    else if (k === 'ArrowDown') { e.preventDefault(); cfg.speed = Math.max(10, cfg.speed - 5); apply(); save(); }
    else if (k === '+' || k === '=') { cfg.fs = Math.min(110, cfg.fs + 2); apply(); save(); }
    else if (k === '-') { cfg.fs = Math.max(24, cfg.fs - 2); apply(); save(); }
  }
  document.addEventListener('keydown', keys, true);
  document.addEventListener('fullscreenchange', function f() { if (!document.fullscreenElement) { document.removeEventListener('fullscreenchange', f); } });
  apply(); update(); wake();
}

/* ====================== 9. PANEL DE ADMINISTRADOR ====================== */
function renderAdmin() {
  if (S.profile.rol !== 'admin') return go('library');
  $('#main').innerHTML = `<section class="page"><div class="head"><div><h2 class="serif">Administración</h2><p class="muted">Gestiona quién puede usar la aplicación.</p></div>
  <button class="btn gold" id="nu">${ic.plus} Nuevo usuario</button></div><div class="stats" id="stats"></div>
  <div class="toolbar"><div class="search">${ic.search}<input id="uq" placeholder="Buscar usuario…"></div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Discursos</th><th>Creado</th><th></th></tr></thead><tbody id="ub"></tbody></table></div></section>`;
  $('#nu').onclick = () => userForm();
  $('#uq').oninput = paintUsers;
  $('#ub').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const u = S.users.find(x => x.id === b.closest('tr').dataset.id), a = b.dataset.a;
    if (a === 'edit') return userForm(u);
    if (a === 'toggle') { await updateDoc(doc(db, 'users', u.id), { activo: !u.activo }); return toast(u.activo ? 'Usuario desactivado' : 'Usuario activado'); }
    if (a === 'reset') {
      if (u.email.endsWith(DOMAIN)) return toast('Este usuario no tiene correo real. Debe cambiar su contraseña desde su cuenta, o crea uno nuevo.', 'err');
      try { await sendPasswordResetEmail(auth, u.email); toast('Correo de recuperación enviado'); } catch (er) { toast(authMsg(er.code), 'err'); } return;
    }
    if (a === 'del' && await confirmDlg('¿Eliminar usuario?', `Se borrarán "${u.nombre}" y todos sus discursos. Esta acción no se puede deshacer.`)) {
      try {
        const sps = await getDocs(collection(db, 'users', u.id, 'speeches')); const bt = writeBatch(db);
        sps.forEach(d => bt.delete(d.ref)); bt.delete(doc(db, 'users', u.id)); await bt.commit(); toast('Usuario eliminado');
      } catch (er) { toast(authMsg(er.code), 'err'); }
    }
  };
  S.unsubUsers?.();
  S.unsubUsers = onSnapshot(query(collection(db, 'users'), orderBy('creadoEn', 'desc')), snap => {
    S.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); paintUsers();
    S.users.forEach(u => { if (S.counts[u.id] === undefined) { S.counts[u.id] = 0; getCountFromServer(collection(db, 'users', u.id, 'speeches')).then(r => { S.counts[u.id] = r.data().count; paintUsers(); }).catch(() => { }); } });
  }, e => toast(authMsg(e.code), 'err'));
}
function paintUsers() {
  if (S.view !== 'admin') return;
  const q = ($('#uq')?.value || '').toLowerCase(), us = S.users;
  $('#stats').innerHTML = [['Usuarios', us.length], ['Activos', us.filter(u => u.activo).length], ['Administradores', us.filter(u => u.rol === 'admin').length], ['Discursos', Object.values(S.counts).reduce((a, b) => a + b, 0)]].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#ub').innerHTML = us.filter(u => !q || (u.nombre + u.usuario).toLowerCase().includes(q)).map(u => {
    const me = u.id === S.user.uid;
    return `<tr data-id="${u.id}"><td><div class="who"><span class="av">${esc((u.nombre || '?')[0]).toUpperCase()}</span><div><b>${esc(u.nombre)}${me ? ' (tú)' : ''}</b><span class="muted sm">${esc(u.usuario)}</span></div></div></td>
    <td><span class="badge ${u.rol}">${u.rol === 'admin' ? 'Administrador' : 'Usuario'}</span></td><td><span class="badge ${u.activo ? 'on' : 'off'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
    <td>${S.counts[u.id] ?? '–'}</td><td class="muted sm">${fmtDate(u.creadoEn)}</td>
    <td><div class="acts"><button class="icon" data-a="edit" title="Editar">${ic.edit}</button><button class="icon" data-a="reset" title="Restablecer contraseña (correo)">${ic.mail}</button>
    ${me ? '' : `<button class="icon" data-a="toggle" title="${u.activo ? 'Desactivar' : 'Activar'}">${ic.power}</button><button class="icon" data-a="del" title="Eliminar">${ic.trash}</button>`}</div></td></tr>`;
  }).join('') || `<tr><td colspan="6" class="muted" style="text-align:center;padding:30px">Sin resultados</td></tr>`;
}
function userForm(u) {
  const m = modal(`<h3>${u ? 'Editar usuario' : 'Nuevo usuario'}</h3><form id="uf"><label>Nombre completo<input name="n" required value="${esc(u?.nombre)}"></label>
  <label>Usuario o correo de acceso<input name="u" required ${u ? 'disabled' : ''} value="${esc(u?.usuario)}" placeholder="ej. maria.lopez"></label>
  ${u ? '' : `<small class="hint">Sin espacios. Si escribes un correo real, podrá recuperar su contraseña por email.</small><label>Contraseña temporal<input name="p" type="text" minlength="6" required></label>`}
  <label>Rol<select name="r"><option value="user">Usuario</option><option value="admin" ${u?.rol === 'admin' ? 'selected' : ''}>Administrador</option></select></label>
  <div class="err" id="ue"></div><div class="actions"><button type="button" class="btn ghost" data-c>Cancelar</button><button class="btn gold">Guardar</button></div></form>`);
  m.querySelector('[data-c]').onclick = m.close;
  m.querySelector('#uf').onsubmit = async e => {
    e.preventDefault(); const f = e.target, b = f.querySelector('.gold'); b.disabled = true; const err = m.querySelector('#ue'); err.textContent = '';
    try {
      if (u) {
        if (u.id === S.user.uid && f.r.value !== 'admin') throw { code: 'self' };
        await updateDoc(doc(db, 'users', u.id), { nombre: f.n.value.trim(), rol: f.r.value }); toast('Usuario actualizado');
      } else {
        const usuario = f.u.value.trim().toLowerCase(), email = toEmail(usuario);
        if (email === DOMAIN) throw { code: 'auth/invalid-email' };
        const cred = await createUserWithEmailAndPassword(secAuth, email, f.p.value); await signOut(secAuth);
        await setDoc(doc(db, 'users', cred.user.uid), { nombre: f.n.value.trim(), usuario, email, rol: f.r.value, activo: true, creadoEn: serverTimestamp(), creadoPor: S.user.uid });
        toast('Usuario creado');
      }
      m.close();
    } catch (er) { err.textContent = er.code === 'self' ? 'No puedes quitarte el rol de administrador.' : authMsg(er.code); b.disabled = false; }
  };
}
